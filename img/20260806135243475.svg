<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img">
  <style>
    svg text { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    :root {
      --color-text-primary: #1a1a1a;
      --color-text-secondary: #5f5e5a;
      --color-border-primary: #888780;
      --color-border-tertiary: #d3d1c7;
    }
    .th { font-size: 13px; font-weight: 500; fill: var(--color-text-primary); }
    .ts { font-size: 11px; font-weight: 400; fill: var(--color-text-secondary); }
    .t  { font-size: 14px; font-weight: 400; fill: var(--color-text-primary); }
    .c-purple > rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-teal   > rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-coral  > rect { fill: #FAECE7; stroke: #993C1D; }
    .c-amber  > rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-blue   > rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-gray   > rect { fill: #F1EFE8; stroke: #444441; }
  </style>
  <title>编排引擎状态机：暂停恢复与人工审批</title>
  <desc>展示编排工作流从启动到完成的状态转换，包括审批暂停点和异常处理</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="500" fill="var(--color-text-primary)">编排引擎状态机 — 暂停/恢复 + 人工审批</text>

  <!-- Step 1: pending -->
  <g class="node c-gray">
    <rect x="30" y="55" width="110" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="85" y="76" text-anchor="middle" dominant-baseline="central" font-size="13">pending</text>
    <text class="ts" x="85" y="92" text-anchor="middle" dominant-baseline="central" font-size="11">等待触发</text>
  </g>

  <path d="M140 80 L175 80" fill="none" stroke="var(--color-border-primary)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: running -->
  <g class="node c-blue">
    <rect x="180" y="55" width="110" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="235" y="76" text-anchor="middle" dominant-baseline="central" font-size="13">running</text>
    <text class="ts" x="235" y="92" text-anchor="middle" dominant-baseline="central" font-size="11">逐步执行</text>
  </g>

  <path d="M235 105 L235 145" fill="none" stroke="var(--color-border-primary)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="128" font-size="11" fill="var(--color-text-secondary)">遇到 human_approval 节点</text>

  <!-- Step 3: paused -->
  <g class="node c-amber">
    <rect x="180" y="150" width="110" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="235" y="171" text-anchor="middle" dominant-baseline="central" font-size="13">paused</text>
    <text class="ts" x="235" y="187" text-anchor="middle" dominant-baseline="central" font-size="11">等待审批</text>
  </g>

  <path d="M290 175 L380 175" fill="none" stroke="var(--color-border-primary)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="335" y="168" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">写入</text>

  <g class="node c-teal">
    <rect x="385" y="150" width="130" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="450" y="171" text-anchor="middle" dominant-baseline="central" font-size="13">human_approvals</text>
    <text class="ts" x="450" y="187" text-anchor="middle" dominant-baseline="central" font-size="11">status=pending</text>
  </g>

  <path d="M175 175 Q120 175 120 140 Q120 105 175 105" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="100" y="145" text-anchor="middle" font-size="10" fill="#0F6E56">approval</text>
  <text x="100" y="157" text-anchor="middle" font-size="10" fill="#0F6E56">approved</text>

  <path d="M235 200 L235 245" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="228" font-size="11" fill="#A32D2D">approval rejected</text>

  <g class="node c-coral">
    <rect x="180" y="250" width="110" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="235" y="271" text-anchor="middle" dominant-baseline="central" font-size="13">failed</text>
    <text class="ts" x="235" y="287" text-anchor="middle" dominant-baseline="central" font-size="11">流程终止</text>
  </g>

  <path d="M290 275 L380 275" fill="none" stroke="var(--color-border-primary)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="335" y="268" text-anchor="middle" font-size="10" fill="var(--color-text-secondary)">通知</text>

  <g class="node c-coral">
    <rect x="385" y="250" width="130" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="450" y="271" text-anchor="middle" dominant-baseline="central" font-size="13">WebSocket + IM</text>
    <text class="ts" x="450" y="287" text-anchor="middle" dominant-baseline="central" font-size="11">通知发起人</text>
  </g>

  <path d="M290 80 L420 80" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="355" y="73" text-anchor="middle" font-size="10" fill="#0F6E56">全部步骤完成</text>

  <g class="node c-teal">
    <rect x="425" y="55" width="110" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="480" y="76" text-anchor="middle" dominant-baseline="central" font-size="13">completed</text>
    <text class="ts" x="480" y="92" text-anchor="middle" dominant-baseline="central" font-size="11">流程结束</text>
  </g>

  <path d="M295 162 Q370 130 420 102" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="395" y="130" text-anchor="middle" font-size="10" fill="#854F0B">timeout(24h)</text>

  <g transform="translate(40, 340)">
    <text x="0" y="0" font-size="11" font-weight="500" fill="var(--color-text-primary)">关键设计点</text>
    <circle cx="8" cy="18" r="4" fill="#AFA9EC"/>
    <text x="20" y="22" font-size="11" fill="var(--color-text-secondary)">状态持久化在 agent_workflows 表 — Worker 崩溃后可恢复</text>
    <circle cx="8" cy="38" r="4" fill="#EF9F27"/>
    <text x="20" y="42" font-size="11" fill="var(--color-text-secondary)">paused 态启动 watchdog 定时器 — 超时自动转 failed</text>
    <circle cx="8" cy="58" r="4" fill="#1D9E75"/>
    <text x="20" y="62" font-size="11" fill="var(--color-text-secondary)">审批通过后 Celery 拉起新 Task 继续执行 — 不依赖原 Worker</text>
  </g>
</svg>